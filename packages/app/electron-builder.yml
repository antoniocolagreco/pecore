appId: app.pecore.desktop
productName: PeCore
extraMetadata:
  author: "<PE/CORE> contributors"
  description: "<PE/CORE> is a desktop software factory."
  desktopName: pecore.desktop
  license: Apache-2.0
files:
  - out/**/*
extraResources:
  - from: resources
    to: .
  - from: ../agents/out/adapters
    to: adapters
  - from: ../agents/adapters.json
    to: adapters.json
publish: null
linux:
  target:
    - AppImage
  executableName: pecore
  icon: resources/icon.png
  category: Development
  syncDesktopName: true
  desktop:
    entry:
      Name: "<PE/CORE>"
mac:
  extendInfo:
    CFBundleName: "<PE/CORE>"
    CFBundleDisplayName: "<PE/CORE>"
