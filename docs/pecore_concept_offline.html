<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>&lt;PE/CORE&gt; · Offline UI Concept</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;color:var(--text)}body{background:radial-gradient(ellipse 65% 52% at 13% 84%,#42644d38,transparent 80%),radial-gradient(ellipse 52% 55% at 89% 5%,#9a904224,transparent 75%),linear-gradient(145deg,#212b2a,#232a2e 52%,#242b2d);background-attachment:fixed}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:none;background:none}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}input,textarea,select{color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}input::placeholder,textarea::placeholder{color:#87968c}textarea{resize:vertical}a{color:var(--mint)}.shell{width:min(1530px,calc(100vw - 42px));min-height:calc(100vh - 42px);margin:21px auto;display:grid;grid-template-columns:232px minmax(0,1fr);background:#232d2de8;border:1px solid #60736345;box-shadow:var(--shadow);border-radius:20px;overflow:hidden;backdrop-filter:blur(28px)}.sidebar{background:#232c2cb3;border-right:1px solid #49594a60;padding:24px 15px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:11px;padding:0 12px}.brandmark{display:grid;place-items:center;width:39px;height:39px;border:1px solid #a7c08055;background:linear-gradient(145deg,#55726044,#31534966);border-radius:12px;color:var(--mint);font-size:23px;font-weight:800}.brand strong{font-size:19px;letter-spacing:-.6px}.brand small{display:block;color:var(--faint);font-size:10px;margin-top:2px;letter-spacing:.06em;text-transform:uppercase}.navgroup{display:flex;flex-direction:column;gap:3px}.navlabel{font-size:10px;letter-spacing:.12em;color:#829388;padding:14px 14px 7px;font-weight:700}.navitem{width:100%;text-align:left;border-radius:10px;padding:11px 12px;display:flex;al n-items:center;gap:13px;padding:13px 0;border-top:1px solid #64726230}.item:first-of-type{border-top:0}.item .bullet{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:10px;background:#4a614a47;color:var(--mint);font-size:16px}.item .t{font-size:12px;font-weight:630}.item .d{font-size:11px;color:var(--faint);margin-top:5px}.item.clickable{cursor:pointer;border-radius:7px;padding-left:7px;padding-right:7px}.item.clickable:hover{background:#45574938}.push{margin-left:auto}.tag{color:var(--faint);font-size:11px;border:1px solid #5b6b5c55;border-radius:7px;padding:4px 7px}.hr{height:1px;background:#61726344;margin:18px 0}.chatbox{background:#25302f8c;min-height:300px;display:flex;flex-direction:column;gap:15px}.msg{max-width:90%;font-size:12px;line-height:1.6;padding:12px 14px;border-radius:12px;background:#4254486b}.msg.user{align-self:flex-end;background:#485747}.msg.bot{align-self:flex-start}.chatinput{display:flex;gap:8px;margin-top:auto}.chatinput input{flex:1;width:80px}.overview-chat{min-height:100%;display:flex;flex-direction:column}.kpirow{display:flex;gap:7px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.number{color:var(--mint);font-size:12px;font-weight:650}.project{cursor:pointer;transition:border .2s,transform .2s}.project:hover{border-color:#9cbc8f85;transform:translateY(-2px)}.project-icon{font-size:21px;color:var(--mint)}.mono,pre,.code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.code{background:#202b2b;border:1px solid #41534c;border-radius:10px;padding:16px;font-size:11px;white-space:pre-wrap;line-height:1.8;color:#cbd9c2;overflow-x:auto}.code .add{color:var(--mint)}.code .warn{color:var(--amber)}.tabs{display:flex;gap:7px;border-bottom:1px solid #55665855;margin-bottom:15px;overflow-x:auto}.tab{padding:10px 13px;color:var(--muted);white-space:nowrap;font-size:12px;border-bottom:2px solid transparent}.tab.active{color:var(--mint);border-bottom-color:var(--mint)}.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #6370643b;font-size:12px}.kv:last-child{border:0}.kv .val{font-weight:550;text-align:right}.formlabel{font-size:11px;color:var(--muted);margin-bottom:6px;display:block}.formfield{width:100%}.steps{display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:thin;padding:20px 0}.step{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:84px}.step .round{border:1px solid #617467;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted);background:#33413b}.step.done .round{color:#263329;background:var(--mint);border-color:var(--mint)}.step.live .round{color:var(--teal);border:2px solid var(--teal);box-shadow:0 0 18px #83c09222}.step .label{font-size:10px;text-align:center;color:var(--muted);white-space:nowrap}.connector{height:2px;min-width:13px;flex:1;background:#66756870;position:relative;top:-12px}.connector.done{background:var(--mint)}.progress{height:8px;border-radius:50px;background:#4c5d54;overflow:hidden}.progress .fill{height:100%;width:62%;background:linear-gradient(90deg,#7fbbb3,#a7c080);border-radius:inherit}.graph{background-color:#25312e;background-image:radial-gradient(#5b735c35 1px,transparent 1px);background-size:20px 20px;border:1px solid #63786545;border-radius:12px;padding:24px 17px;min-height:270px;display:flex;flex-direction:column;align-items:center;gap:14px;overflow:auto}.graphline{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}.node{min-width:82px;max-width:130px;min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:10px 12px;border:1px solid #78957e65;background:#32433b;border-radius:9px;text-align:left;cursor:pointer;transition:border .15s,box-shadow .15s}.node strong{font-size:11px;white-space:nowrap}.node small{font-size:10px;color:var(--muted)}.node.done{border-color:#8fb079}.node.live{border-color:var(--teal);box-shadow:0 0 0 2px #83c09222}.node.pending{opacity:.65}.node.selected{border-color:#d9bc80;box-shadow:0 0 0 2px #dbbc7f35}.arrow{font-size:20px;color:var(--mint)}.flowhint{font-size:11px;color:var(--amber);text-align:center}.logs{font-family:ui-monospace,monospace;font-size:11px;line-height:2.1;color:#c4d5c1}.logs b{color:var(--teal);font-weight:400}.logs .time{color:#7e948b}.listbtn{display:block;width:100%;text-align:left;padding:14px;border-radius:10px;border:1px solid #596c5a55;background:#293733;cursor:pointer;margin:8px 0}.listbtn:hover,.listbtn.selected{border-color:#a7c08085;background:#3c50407a}.listbtn strong{display:block;font-size:12px}.listbtn small{display:block;margin-top:7px;color:var(--muted)}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.pal{height:44px;border-radius:8px;border:1px solid #fff2}.paltext{font-size:10px;text-align:center;color:var(--muted);margin-top:5px}.toast{position:fixed;bottom:25px;right:25px;background:#3c5644;border:1px solid #8eb58b85;border-radius:11px;padding:13px 18px;box-shadow:var(--shadow);font-size:12px;z-index:100;max-width:330px;opacity:0;transform:translateY(10px);pointer-events:none;transition:all .2s}.toast.show{opacity:1;transform:translateY(0)}.empty{border:1px dashed #62786575;border-radius:10px;padding:30px;color:var(--muted);text-align:center}.wide{width:100%}.tabs-only-mobile{display:none}.pills{display:flex;gap:7px;flex-wrap:wrap}.project-kicker{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#a8c39e}.footer{margin-top:45px;font-size:11px;color:#738a7c;display:flex;justify-content:space-between;gap:20px}.notice{background:#69552d2e;border:1px solid #b1935c60;border-radius:11px;padding:13px 15px;color:#e0c996;font-size:12px}.shadowline{box-shadow:0 8px 32px #10221e38}.selected-row{background:#4156444d!important}
@media(max-width:1000px){.shell{grid-template-columns:190px minmax(0,1fr)}.content{padding:24px}.sidebar{padding:20px 10px}.split{grid-template-columns:1fr}.topsearch{display:none}.grid3{gap:9px}.metric{padding:17px}.metric .num{font-size:27px}}@media(max-width:700px){.shell{width:100%;min-height:100vh;margin:0;border:0;border-radius:0;grid-template-columns:1fr}.sidebar{display:none}.topbar{height:60px;padding:0 15px}.content{padding:20px 15px}.title{font-size:23px}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.metric{padding:14px}.metric .num{font-size:24px}.metric .lab{font-size:10px}.tabs-only-mobile{display:block}.head{flex-direction:column}.steps{padding:12px 0}.footer{flex-direction:column}.graph{padding:16px 5px}.node{min-width:68px;padding:9px 5px}.node strong{font-size:9px}.node small{font-size:9px}.arrow{font-size:14px}}

<body>
<div class="shell"><aside class="sidebar" id="sidebar"></aside><div class="main"><header class="topbar" id="topbar"></header><div class="content"><div class="tabs-only-mobile"><label class="formlabel">Navigate</label><select id="mobileNav" class="wide" onchange="navigate(this.value)" style="margin-bottom:20px"></select></div><main id="content"></main><footer class="footer"><span>&lt;PE/CORE&gt; UI Concept · Everforest · Offline prototype</span><span>No network calls · Demo data only</span></footer></div></div></div><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const views=[['factory','Factory','◈'],['chat','Assistant','☷'],['projects','Projects','▣'],['jobs','Jobs','≡'],['jobview','Job detail','◇'],['inbox','Inbox','◎'],['recipes','Recipe editor','⬡'],['nodes','Node editor','⌘'],['library','Library','▤'],['projectsettings','Project settings','⚙'],['accounts','Accounts & models','☯'],['settings','Settings','⚒'],['setup','First run setup','✧']];
const state={view:'factory',jobFilter:'all',review:'review',nodeTab:'prompt',selectedNode:'Builder',recipeNode:'Builder',chat:[],approvals:{},jobPaused:false,globalPaused:false,project:'Payment Ledger',setupStage:2,sidebarProject:'Payment Ledger'};
const jobs=[{id:'42',name:'Implement idempotency',project:'Payment Ledger',status:'running',stage:'Codex · Builder · Round 2',time:'5m 23s'},{id:'43',name:'Transactional outbox',project:'Payment Ledger',status:'waiting',stage:'Human approval required',time:'14m 02s'},{id:'44',name:'Player movement',project:'Game Engine',status:'running',stage:'Claude · Tests writer',time:'8m 41s'},{id:'39',name:'Initialize Godot project',project:'Game Engine',status:'completed',stage:'Merge request opened',time:'12m 11s'},{id:'38',name:'Fix payload validation',project:'Payment Ledger',status:'failed',stage:'Invalid output · attempt 2',time:'4m 16s'}];
const badge=(s,override)=>`<span class="badge ${({running:'running',waiting:'waiting',completed:'success',failed:'failed',queued:'queued',passed:'success',paused:'queued'})[s]||'queued'}">${override||({running:'● Running',waiting:'◷ Waiting',completed:'✓ Completed',failed:'✕ Failed',queued:'Queued',paused:'Paused'})[s]||s}</span>`;
const card=(html,classes='')=>`<section class="card ${classes}">${html}</section>`;
const btn=(text,action,variant='ghost',extra='')=>`<button class="btn ${variant} ${extra}" onclick="${action}">${text}</button>`;
const head=(title,subtitle,actions='',kicker='WORKSPACE')=>`<div class="head"><div><div class="eyebrow">${kicker}</div><h1 class="title">${title}</h1><p class="subtitle">${subtitle}</p></div>${actions?`<div class="row">${actions}</div>`:''}</div>`;
function toast(msg){const e=document.querySelector('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),2900)}
function navigate(id){if(!views.some(v=>v[0]===id))return;state.view=id;render();document.querySelector('.main').scrollIntoView({block:'start'});history.replaceState(null,'','#'+id)}
function sidebar(){const n=(id)=>{let v=views.find(x=>x[0]===id);return `<button class="navitem ${state.view===id?'active':''}" onclick="navigate('${id}')"><span class="navicon">${v[2]}</span>${v[1]}${id==='inbox'?'<span class="counter">2</span>':''}</button>`};return `<div class="brand"><div class="brandmark">P</div><div><strong>&lt;PE/CORE&gt;</strong><small>Software factory</small></div></div><div class="navgroup"><div class="navlabel">WORKSPACE</div>${['factory','chat','projects','jobs','inbox'].map(n).join('')}<div class="navlabel">BUILD</div>${['recipes','library','nodes'].map(n).join('')}<div class="navlabel">SYSTEM</div>${['accounts','settings','setup'].map(n).join('')}</div><div class="sidebarfoot"><div class="mini"><div class="row"><span class="dot"></span><strong class="sm">Engine running</strong></div><div class="sub">2 agents active · 1 awaiting approval</div></div><button class="navitem" onclick="navigate('projectsettings')"><span class="navicon">▣</span>Payment Ledger</button></div>`}
function topbar(){const v=views.find(x=>x[0]===state.view);return `<div class="crumb"><span>&lt;PE/CORE&gt;</span><span>›</span><b>${v[1]}</b></div><div class="actions"><span class="status"><span class="dot"></span>Local engine</span><span class="topsearch">⌕ Search workspaces…　⌘ K</span><button class="btn tiny ghost" onclick="navigate('inbox')">◎ 2</button><div class="avatar">AC</div></div>`}
function jobRow(j){return `<div class="item clickable" onclick="navigate('jobview')"><div class="bullet">${j.status==='running'?'↻':j.status==='completed'?'✓':j.status==='waiting'?'◷':'!'}</div><div class="grow"><div class="t">${j.name} <span class="faint xs">#${j.id}</span></div><div class="d">${j.project} · ${j.stage}</div></div>${badge(j.status)}</div>`}
function factory(){return head('Your factory','Tuesday, November 17 · A clear view of work across all projects.',btn('＋ New job',"navigate('chat')",'primary'))+`<div class="grid3">${[['2','Running','↻'],['1','Waiting','◷'],['12','Completed today','✓']].map(([n,l,i])=>card(`<span class="spark">${i}</span><div class="num">${n}</div><div class="lab"><span class="dot"></span>${l}</div>`,'metric')).join('')}</div><div class="split section"><div>${card(`<div class="row between"><h3>Active jobs</h3><button class="btn tiny ghost" onclick="navigate('jobs')">View all →</button></div>${jobs.slice(0,3).map(jobRow).join('')}`)}</div><div>${card(`<div class="row between"><h3>Assistant</h3><span class="badge success">Ready</span></div><div class="chatbox" style="min-height:232px;border-radius:10px;padding:12px"><div class="msg user">Fix the idempotency issue in Payment Ledger.</div><div class="msg bot">I've created a job using the bugfix recipe. The builder is currently running.</div><div class="chatinput"><button class="btn wide primary" onclick="navigate('chat')">Open conversation ↗</button></div></div>`,'overview-chat')}</div></div><div class="grid2 section">${card(`<h3>Projects</h3><div class="item"><div class="bullet">◈</div><div class="grow"><div class="t">Payment Ledger</div><div class="d">3 jobs · TypeScript · GitHub</div></div><span class="badge running">Active</span></div><div class="item"><div class="bullet">▣</div><div class="grow"><div class="t">Game Engine</div><div class="d">1 job · Rust · GitLab</div></div><span class="badge running">Active</span></div>`)}${card(`<h3>Needs attention</h3><div class="item"><div class="bullet" style="color:var(--amber)">!</div><div class="grow"><div class="t">Human review required</div><div class="d">Event outbox · Payment Ledger</div></div>${btn('Review',"navigate('inbox')",'ghost tiny')}</div><div class="item"><div class="bullet" style="color:var(--amber)">!</div><div class="grow"><div class="t">Recipe modification</div><div class="d">New security scan requested</div></div></div>`)}</div>`}
function chat(){return head('Assistant','Describe the outcome. &lt;PE/CORE&gt; plans the work and delegates it to agents.',btn('＋ New conversation',"state.chat=[];render();toast('New demo conversation')")) +card(`<div class="chatbox" style="min-height:490px;padding:20px;border-radius:12px"><div class="msg user">Build a payment ledger with idempotency, outbox and audit history.</div><div class="msg bot">I'll split this into dependent jobs in the Payment Ledger project, using the feature recipe.</div>${card(`<div class="row between"><h3 style="margin:0">Execution proposal</h3><span class="badge running">3 jobs</span></div>${[['01','Ledger foundation','Schema and domain model'],['02','Idempotency','Depends on job 01'],['03','Transactional outbox','Depends on job 02']].map(([n,t,d])=>`<div class="item"><div class="bullet mono">${n}</div><div class="grow"><div class="t">${t}</div><div class="d">${d}</div></div></div>`).join('')}`, 'flat')}${state.chat.map(m=>`<div class="msg ${m.role}">${escapeHtml(m.text)}</div>`).join('')}<form class="chatinput" onsubmit="sendChat(event)"><input name="message" aria-label="Message" placeholder="Ask &lt;PE/CORE&gt;… (demo reply)" autocomplete="off"><button class="btn primary">↑ Send</button></form></div>`)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sendChat(e){e.preventDefault();let input=e.target.message;const m=input.value.trim();if(!m)return;state.chat.push({role:'user',text:m},{role:'bot',text:'Demo response: I can propose a recipe and jobs for that request. No jobs have actually been created.'});render()}
function projects(){const ps=[['◈','Payment Ledger','github.com/ac/payment-ledger','TypeScript · GitHub','3 active jobs'],['▣','Game Engine','gitlab.com/ac/game-engine','Rust · GitLab','1 active job'],['⬡','Arrosticini 24','github.com/ac/arrosticini','TypeScript · GitHub','No running jobs']];return head('Projects','Independent workspaces, each with its own recipes, artifacts, history and repository.',btn('＋ New project',"toast('Demo: project creation wizard')",'primary'))+`<div class="grid2">${ps.map(p=>card(`<div class="row between"><span class="project-icon">${p[0]}</span><span class="badge ${p[4]==='No running jobs'?'queued':'running'}">${p[4]}</span></div><h3 style="font-size:17px;margin:20px 0 6px">${p[1]}</h3><div class="sm faint mono">${p[2]}</div><div class="hr"></div><div class="row between"><span class="sm muted">${p[3]}</span><button class="btn tiny ghost" onclick="navigate('projectsettings')">Open →</button></div>`,'project')).join('')}</div>`}
function jobsPage(){let result=jobs.filter(j=>state.jobFilter==='all'||(state.jobFilter==='finished'?['completed','failed'].includes(j.status):j.status===state.jobFilter));return head('Jobs','Track work across projects, inspect execution and manage individual jobs.',btn(state.globalPaused?'▶ Resume all':'Ⅱ Pause all',"state.globalPaused=!state.globalPaused;render();toast('Demo: global controls changed')")) +`<div class="row between" style="margin-bottom:18px;flex-wrap:wrap;gap:12px"><div class="tabs" style="margin:0">${[['all','All'],['running','Running'],['waiting','Waiting'],['finished','Finished']].map(([v,l])=>`<button class="tab ${state.jobFilter===v?'active':''}" onclick="state.jobFilter='${v}';render()">${l}</button>`).join('')}</div><span class="sm muted">${result.length} jobs</span></div>${card(result.length?result.map(j=>`<div class="item clickable" onclick="navigate('jobview')"><div class="bullet">${j.status==='running'?'↻':j.status==='completed'?'✓':j.status==='waiting'?'◷':'!'}</div><div class="grow"><div class="t">${j.name} <span class="faint xs">#${j.id}</span></div><div class="d">${j.project} · ${j.stage}</div></div><span class="sm faint">${j.time}</span>${badge(j.status)}</div>`).join(''):'<div class="empty">No jobs match this filter.</div>')}`}
const steps=[['Spec','done'],['Tests','done'],['Builder','live'],['Lint','pending'],['Typecheck','pending'],['Review','pending'],['Approval','pending'],['Commit','pending'],['PR','pending']];
function graph(edit=false){const first=[['Spec writer','done'],['Tests writer','done'],['Builder',edit?'done':'live']];const second=[['Lint','pending'],['Typecheck','pending'],['Tests','pending']];const third=[['Code review','pending'],['Human approval','pending'],['Git commit','pending'],['GitHub PR','pending']];const n=([name,status])=>{let sel=(edit?state.recipeNode:state.selectedNode)===name;return `<button class="node ${status} ${sel?'selected':''}" onclick="${edit?`state.recipeNode='${name}';render()`:`state.selectedNode='${name}';render()`}"><strong>${name}</strong><small>${edit?'Node template':status==='done'?'✓ Completed':status==='live'?'↻ Running':'○ Pending'}</small></button>`};const line=a=>`<div class="graphline">${a.map((x,i)=>`${i?'<span class="arrow">→</span>':''}${n(x)}`).join('')}</div>`;return `<div class="graph"><div class="xs faint">START ↓</div>${line(first)}<div class="flowhint">↓ accepted / retry loops on failure ↺</div>${line(second)}<div class="flowhint">↓ checks passed</div>${line(third)}<div class="xs faint">↓ DELIVERED</div></div>`}
function jobview(){const selected=state.selectedNode;return head('Implement idempotency',`Payment Ledger / Job #42 / feature recipe · main`,btn('‹ All jobs',"navigate('jobs')")+btn(state.jobPaused?'▶ Play':'Ⅱ Pause',"state.jobPaused=!state.jobPaused;render();toast('Demo: job control changed')")+btn('□ Stop',"toast('Demo: stop requested. No real processes exist.')",'danger'))+`<div class="row between" style="margin-bottom:14px"><div class="pills">${badge(state.jobPaused?'paused':'running')}<span class="tag">Codex · strong</span><span class="tag">5m 23s elapsed</span></div><span class="sm faint">branch: factory/42</span></div><div class="split">${card(`<div class="row between"><h3>Live execution graph</h3><span class="badge running">● Live</span></div>${graph(false)}<div class="row" style="margin-top:12px;flex-wrap:wrap"><span class="badge success">✓ 2 completed</span><span class="badge running">1 running</span><span class="badge queued">6 pending</span></div>`)}${card(`<h3>${selected} · Node inspector</h3><div class="row between"><span class="sm muted">${selected==='Builder'?'Codex · round 2':'Agent / command node'}</span>${badge(selected==='Builder'?'running':selected==='Spec writer'||selected==='Tests writer'?'completed':'queued')}</div><div class="hr"></div><div class="kv"><span class="muted">Duration</span><span class="val">2m 14s</span></div><div class="kv"><span class="muted">Content state</span><span class="mono sm">9ba2fc1</span></div><div class="kv"><span class="muted">Retries</span><span class="val">1 / 3</span></div><h3 style="margin-top:20px">Recent activity</h3><div class="code">[14:21:07] Reading payment service...\n[14:21:19] Editing idempotency.ts\n[14:21:46] Generating unit tests\n[14:22:03] Waiting for test output...</div><div class="row" style="margin-top:18px">${btn('View artifacts',"toast('Demo artifacts panel')",'ghost tiny')}${btn('Raw logs',"toast('Demo logs panel')",'ghost tiny')}</div>`)}</div>`}
function inbox(){const review=state.review==='review';return head('Needs your attention','Only decisions that require you. Agents can proceed independently elsewhere.',`<span class="badge waiting">2 pending</span>`)+`<div class="split" style="grid-template-columns:minmax(240px,.85fr) minmax(0,1.6fr)"><div>${[['review','Code review','Payment Ledger · #43'],['confirmation','Recipe modification','New security scan node']].map(([id,t,d])=>`<button class="listbtn ${state.review===id?'selected':''}" onclick="state.review='${id}';render()"><strong>${t} ${state.approvals[id]?'✓':''}</strong><small>${d}</small></button>`).join('')}</div>${card(review?`<div class="row between"><h3>Review · Event outbox</h3>${badge('waiting','2 risky hunks')}</div><p class="subtitle">Changes proposed by the builder and classified by the code reviewer.</p><div class="hr"></div><h3>outbox.repository.ts</h3><div class="code"><span class="warn">~ begin transaction</span>\n<span class="add">+ await transaction.insert(event);</span>\n<span class="add">+ await transaction.commit();</span>\n<span class="warn">Risk: transactional consistency</span></div><div class="kv"><span class="muted">Checks</span><span class="badge success">Passed</span></div><div class="row" style="flex-wrap:wrap;margin-top:20px">${btn('✓ Approve',"demoApprove('review','approved')",'primary')}${btn('Request changes',"demoApprove('review','changes requested')")}${btn('Reject',"demoApprove('review','rejected')",'danger')}</div>`:`<h3>Confirm recipe update</h3><p class="subtitle">The Assistant proposes adding a new execution node.</p><div class="hr"></div><div class="code"><span class="add">+ security-scan: command node</span>\n<span class="add">+ tests → security-scan</span>\n<span class="add">+ security-scan → review</span></div><div class="notice" style="margin:16px 0">This changes the recipe definition. User confirmation is required.</div><div class="row">${btn('✓ Confirm',"demoApprove('confirmation','confirmed')",'primary')}${btn('Reject',"demoApprove('confirmation','rejected')",'danger')}</div>`)}</div>`}
function demoApprove(id,result){state.approvals[id]=result;toast(`Demo only: ${result}. No job or recipe was changed.`);render()}
const recipeNames=['Feature','Bug fix','Refactor','Hotfix','Local commit'];
function recipes(){return head('Recipe editor','Build and modify your execution logic visually.',btn('＋ Add node',"toast('Demo: add node to recipe')")+btn('Validate & save',"toast('Demo: recipe validates against the schema')",'primary'))+`<div class="row between" style="margin-bottom:15px;flex-wrap:wrap"><div class="row"><label class="faint xs">Recipe</label><select onchange="toast('Demo recipe switched: '+this.value)">${recipeNames.map(x=>`<option>${x}</option>`).join('')}</select></div><span class="badge success">✓ Schema valid</span></div><div class="split" style="grid-template-columns:minmax(0,1.8fr) minmax(245px,.9fr)">${card(graph(true))}${card(`<h3>${state.recipeNode}</h3><p class="sm muted">Configure node instance, outcomes and transitions.</p><div class="hr"></div><div class="kv"><span class="muted">Kind</span><span>Agent</span></div><div class="kv"><span class="muted">Tier</span><span>strong</span></div><div class="kv"><span class="muted">Retry</span><span>1</span></div><div class="kv"><span class="muted">Timeout</span><span>900 sec</span></div><h3 style="margin-top:18px">Outcomes</h3><div class="pills"><span class="tag">done</span><span class="tag">failed</span><span class="tag">tests_disputed</span></div><div class="hr"></div>${btn('Edit node definition →',"navigate('nodes')",'ghost wide')}`)}</div><div class="notice section">Each job executes one node at a time. Conditional edges and retry loops can revisit nodes; parallelism happens across jobs.</div>`}
function nodes(){return head('Node editor','Edit a project instance or global template. All definitions are schema validated.',btn('Validate definition',"toast('Demo: JSON Schema valid')",'ghost')+btn('Save node',"toast('Demo: no files were changed')",'primary'))+`${card(`<div class="grid2"><label><span class="formlabel">Name</span><input class="wide" value="builder"></label><label><span class="formlabel">Kind</span><select class="wide"><option>Agent</option><option>Command</option><option>Human</option><option>Source</option></select></label><label><span class="formlabel">Model tier</span><select class="wide"><option>strong</option><option>frontier</option><option>standard</option><option>cheap</option></select></label><label><span class="formlabel">Timeout (seconds)</span><input class="wide" value="900"></label></div><div class="hr"></div><div class="tabs">${[['prompt','Prompt'],['io','Inputs & outputs'],['advanced','Advanced']].map(([v,t])=>`<button class="tab ${state.nodeTab===v?'active':''}" onclick="state.nodeTab='${v}';render()">${t}</button>`).join('')}</div>${state.nodeTab==='prompt'?'<textarea class="wide mono" rows="11"># Builder\n\nImplement the accepted specification.\n\nInputs:\n  {inputs.spec.path}\n\nFollow project knowledge and return structured output.</textarea>':state.nodeTab==='io'?`<div class="grid2"><div><div class="formlabel">Input artifacts</div><div class="code">spec\nticket\nuser-note</div></div><div><div class="formlabel">Output artifacts</div><div class="code">outcome\ndiff (engine)\ncheck-log</div></div></div>`:`<div class="kv"><span class="muted">Retry</span><span>1</span></div><div class="kv"><span class="muted">Resume session</span><span>True</span></div><div class="kv"><span class="muted">Knowledge</span><span class="mono">architecture/*.md</span></div>`}`)}<div class="notice section">AI assistance is available in the actual design. This offline prototype contains only example fields and simulated actions.</div>`}
function library(){const nodes=[['◇','Spec writer','Agent','Acceptance criteria and interfaces'],['⌘','Builder','Agent','Implements the accepted specification'],['✓','Typecheck','Command','Validates source and test types'],['▣','Git commit','Command','Creates a verified commit'],['↗','GitHub PR','Command','Creates or updates a pull request'],['◎','Human review','Human','Shows risks, artifacts and diff']];return head('Global library','Reusable node and recipe templates. Copies in projects are independent.',btn('＋ New template',"toast('Demo: template creation')",'primary'))+`${card(`<div class="row between"><h3>Node templates</h3><span class="tag">${nodes.length} templates</span></div>${nodes.map(([i,t,k,d])=>`<div class="item clickable" onclick="navigate('nodes')"><div class="bullet">${i}</div><div class="grow"><div class="t">${t}</div><div class="d">${d}</div></div><span class="tag">${k}</span></div>`).join('')}`)}<div class="section">${card(`<h3>Recipe templates</h3>${['Feature','Bug fix','Refactor'].map(t=>`<div class="item clickable" onclick="navigate('recipes')"><div class="bullet">⬡</div><div class="grow"><div class="t">${t}</div><div class="d">Graph template · instantiate to customize</div></div><span class="faint">→</span></div>`).join('')}`)}</div>`}
function projectsettings(){return head('Payment Ledger','Project settings · Local workspace · GitHub repository.',btn('Save settings',"toast('Demo: no settings were saved')",'primary'))+`<div class="split equal">${card(`<h3>Repository & execution</h3>${[['Repository URL','github.com/ac/payment-ledger'],['Base branch','main'],['Forge account','github-personal'],['Project OS user','pecore-payment-ledger'],['Default recipe','feature']].map(([k,v])=>`<div class="kv"><span class="muted">${k}</span><span class="val">${v}</span></div>`).join('')}`)}${card(`<h3>Limits & services</h3>${[['Parallel jobs','3'],['Budget per job','250K tokens'],['Services','compose.yaml'],['Container runtime','Podman'],['Ticket source','GitHub issues · factory']].map(([k,v])=>`<div class="kv"><span class="muted">${k}</span><span class="val">${v}</span></div>`).join('')}`)}</div><div class="section">${card(`<h3>Project knowledge</h3><div class="item"><div class="bullet">▤</div><div class="grow"><div class="t">architecture.md</div><div class="d">Context provided to matching agent nodes</div></div><span class="faint">→</span></div><div class="item"><div class="bullet">▤</div><div class="grow"><div class="t">conventions.md</div><div class="d">Project conventions and domain terminology</div></div><span class="faint">→</span></div>`)}</div>`}
function accounts(){return head('Accounts & models','Connected vendor harnesses, profiles, fallback tiers and login status.',btn('＋ Add account',"toast('Demo: add account flow')",'primary'))+`<div class="split equal">${card(`<h3>Harness accounts</h3>${[['◈','Claude Code','Personal subscription','Connected'],['⌘','Codex','Personal subscription','Connected'],['◇','opencode','API account','Login needed'],['◎','Copilot CLI','Not configured','Disconnected']].map(([i,n,d,s])=>`<div class="item"><div class="bullet">${i}</div><div class="grow"><div class="t">${n}</div><div class="d">${d}</div></div><span class="badge ${s==='Connected'?'success':s==='Login needed'?'waiting':'queued'}">${s}</span></div>`).join('')}`)}${card(`<h3>Routing tiers</h3>${[['Frontier','Top capability profile'],['Strong','Codex / Claude fallback'],['Standard','Balanced coding profile'],['Cheap','Lowest cost available']].map(([n,d])=>`<div class="item"><div class="grow"><div class="t">${n}</div><div class="d">${d}</div></div><span class="faint">→</span></div>`).join('')}<div class="hr"></div><div class="notice">Model subscriptions and authentication remain inside the original harness tools.</div>`)}</div>`}
function settings(){return head('Settings','Configure the local engine, concurrency and appearance.',btn('Save preferences',"toast('Demo: settings not saved')",'primary'))+`<div class="split equal">${card(`<h3>Execution</h3>${[['Max parallel jobs','4'],['Max parallel agents','6'],['Container runtime','Podman'],['Factory home','~/.pecore'],['Merge check interval','5 minutes']].map(([k,v])=>`<div class="kv"><span class="muted">${k}</span><span class="val">${v}</span></div>`).join('')}`)}${card(`<h3>Appearance & alerts</h3><div class="kv"><span class="muted">Theme</span><span class="val">Everforest Dark</span></div><div class="kv"><span class="muted">Desktop notifications</span><span class="val">Enabled</span></div><div class="kv"><span class="muted">Sound alerts</span><span class="val">Off</span></div><div class="kv"><span class="muted">Quiet hours</span><span class="val">22:00 – 08:00</span></div><div class="hr"></div><h3>Theme palette</h3><div class="palette">${[['#232a2e','Base'],['#a7c080','Success'],['#83c092','Active'],['#dbbc7f','Waiting']].map(([c,n])=>`<div><div class="pal" style="background:${c}"></div><div class="paltext">${n}</div></div>`).join('')}</div>`)}</div>`}
function setup(){const items=[['Check prerequisites','Git, runtime and available harnesses'],['Create factory home','Set up ~/.pecore and OS users'],['Connect agent harnesses','Authenticate Claude, Codex and others'],['Create your first project','Repository, recipe and forge account']];return `<div style="max-width:700px;margin:25px auto">${head('Welcome to &lt;PE/CORE&gt;','Prepare your autonomous software factory. Everything runs locally.', '', 'FIRST RUN')}${card(`<div class="row between" style="margin-bottom:20px"><h3 style="margin:0">Setup checklist</h3><span class="badge running">Step ${state.setupStage+1} / 4</span></div>${items.map(([t,d],i)=>`<div class="item"><div class="bullet" style="color:${i<state.setupStage?'var(--mint)':i===state.setupStage?'var(--amber)':'var(--faint)'}">${i<state.setupStage?'✓':i===state.setupStage?'◷':'○'}</div><div class="grow"><div class="t">${t}</div><div class="d">${d}</div></div></div>`).join('')}<div class="hr"></div><div class="row between">${btn('‹ Back',"state.setupStage=Math.max(0,state.setupStage-1);render()",'ghost')}${btn(state.setupStage===3?'Finish demo':'Continue →',"state.setupStage=Math.min(3,state.setupStage+1);render();toast('Demo walkthrough only')",'primary')}</div>`)}<p class="subtitle" style="margin-top:14px;text-align:center">&lt;PE/CORE&gt; will terminate running agents and job containers when the desktop app closes.</p></div>`}
const renders={factory,chat,projects,jobs:jobsPage,jobview,inbox,recipes,nodes,library,projectsettings,accounts,settings,setup};
function render(){document.getElementById('sidebar').innerHTML=sidebar();document.getElementById('topbar').innerHTML=topbar();document.getElementById('mobileNav').innerHTML=views.map(v=>`<option value="${v[0]}" ${state.view===v[0]?'selected':''}>${v[1]}</option>`).join('');document.getElementById('content').innerHTML=renders[state.view]();}
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();navigate('chat')}});
if(location.hash&&views.some(v=>v[0]===location.hash.slice(1)))state.view=location.hash.slice(1);
render();
</script>
</body>
